name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Copy & rename APK artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk izin-app-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: izin-app-release.apk
          name: "[URGENT] Release ${{ github.ref_name }}"
          body: |
            ## [URGENT] Pembaruan Wajib Aplikasi Surat Izin Mahasiswa IDN (${{ github.ref_name }})

            Pembaruan versi ini bersifat **WAJIB / PENTING** untuk seluruh mahasiswa Politeknik IDN.

            ### Apa yang Baru di ${{ github.ref_name }}:
            - **Shortcut & Preset Mata Kuliah IDN**: Akses cepat izin Bahasa Inggris, Diniyah, Tahfidz, dan tambah mapel kustom langsung dari dashboard.
            - **Bank Tanda Tangan Digital**: Simpan dan kelola tanda tangan mahasiswa & wali/ortu tanpa perlu menggambar ulang.
            - **Multi-Profil Mahasiswa**: Kelola data mahasiswa dan beralih antar teman (khusus prodi TRPL, TRKJ, TRMG).
            - **Dashboard Solid Flat**: Desain bersih modern tanpa gradien dan tanpa ornamen berlebih.
            - **Sistem Pembaruan Wajib (Urgent Update Pop-up)**: Notifikasi pembaruan langsung terdeteksi otomatis saat aplikasi dibuka.

            ### Panduan Instalasi:
            1. Unduh file `izin-app-release.apk` di bawah ini.
            2. Buka dan instal berkas APK di perangkat Android Anda untuk memperbarui aplikasi.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
